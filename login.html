<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova Budgeting - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-body">
    <div class="auth-container">
        <!-- Animated Background -->
        <div class="auth-background">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
            <div class="gradient-orb orb-3"></div>
        </div>

        <!-- Content -->
        <div class="auth-content">
            <!-- Logo & Branding -->
            <div class="auth-header">
                <div class="app-logo">
                    <div class="logo-icon">
                        <div class="logo-orbit"></div>
                        <span class="logo-letter">N</span>
                    </div>
                </div>
                <h1 class="auth-title">Nova Budgeting</h1>
                <p class="auth-tagline">AI That Budgets for You</p>
            </div>

            <!-- Login Form -->
            <div class="auth-form-container glass-card">
                <h2 class="form-title">Welcome Back</h2>
                <p class="form-subtitle">Sign in to continue managing your finances</p>

                <!-- Biometric Login -->
                <button class="biometric-btn glass-card">
                    <span class="biometric-icon">🔐</span>
                    <div class="biometric-text">
                        <span class="biometric-label">Sign in with Face ID</span>
                        <span class="biometric-sublabel">Quick & Secure</span>
                    </div>
                </button>

                <div class="divider">
                    <span class="divider-text">or continue with email</span>
                </div>

                <!-- Email/Password Form -->
                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-input glass-input" placeholder="you@example.com"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" class="form-input glass-input"
                                placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                                👁️
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" class="custom-checkbox">
                            <span class="checkbox-text">Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="auth-submit-btn">
                        <span>Sign In</span>
                        <span class="btn-arrow">→</span>
                    </button>
                </form>

                <!-- Social Login -->
                <div class="social-login">
                    <p class="social-label">Or sign in with</p>
                    <div class="social-buttons">
                        <button class="social-btn glass-card">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                    fill="#4285F4" />
                                <path
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                    fill="#34A853" />
                                <path
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                    fill="#FBBC05" />
                                <path
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                    fill="#EA4335" />
                            </svg>
                            <span>Google</span>
                        </button>
                        <button class="social-btn glass-card">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.879V14.89h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.989C18.343 21.129 22 16.99 22 12c0-5.523-4.477-10-10-10z"
                                    fill="#1877F2" />
                            </svg>
                            <span>Facebook</span>
                        </button>
                        <button class="social-btn glass-card" id="appleSignIn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"
                                    fill="#000000" />
                            </svg>
                            <span>Apple</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Sign Up Link -->
            <div class="auth-footer">
                <p class="footer-text">
                    Don't have an account?
                    <a href="register.html" class="footer-link">Sign up</a>
                </p>
            </div>

            <!-- Security Badge -->
            <div class="security-badge">
                <span class="security-icon">🔒</span>
                <span class="security-text">Bank-level encryption • Your data is safe</span>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
